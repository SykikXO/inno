name: Publish to AUR

# Publishes the tagged version to the AUR package `inno`.
#
# Trigger is a version tag, because that is what the PKGBUILD's source URL is
# built from: source=("...${pkgver}.tar.gz::${url}/archive/refs/tags/v${pkgver}.tar.gz").
# workflow_dispatch exists because v0.5.0 was tagged before this workflow
# existed, and re-pushing an existing tag does not fire a tag push.
#
# Required repository secrets:
#   AUR_SSH_KEY           contents of ~/.ssh/aur, the passphrase-protected
#                         ed25519 key already registered on the AUR account
#                         (fingerprint SHA256:OSlaDFCaio3RmFkvQ3YGyWYGzhrdgzpUlCpJHhFjoUQ)
#   AUR_SSH_PASSPHRASE    that key's passphrase
#
# The key is never decrypted to disk. It is written back out still encrypted and
# handed to ssh-agent, which reads the passphrase from stdin. That keeps the
# passphrase off any command line and out of any file in the runner.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.5.0 (leading v optional)'
        required: true
        type: string
      dry_run:
        description: Build everything and print the PKGBUILD, but do not push to AUR
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# One publish at a time. Two concurrent runs would both compute a pkgrel from
# the same AUR state and the second push would lose the first.
concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Backstop. Every network call has its own timeout, but a wedged runner
    # should not be able to hold the concurrency group for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
            v="${v#v}"
          fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$v' is not a version like 0.5.0"; exit 1 ;;
          esac
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a tag that disagrees with the crate
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag:   v$VERSION"
          echo "crate: $crate"
          [ "$crate" = "$VERSION" ] || {
            echo "::error::tag v$VERSION does not match the crate version $crate"
            exit 1
          }

      # A broken commit must never reach AUR, where the only signal is that
      # everyone's builds fail.
      #
      # The -dev packages are needed because cairo-rs, wayland-sys, glib-sys and
      # smithay's build script all shell out to pkg-config. The PKGBUILD gets these
      # for free because Arch ships the .pc files in the runtime packages, so the
      # dependency is invisible until you build on Ubuntu.
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libglib2.0-dev libcairo2-dev libwayland-dev libxkbcommon-dev

      - name: Build check
        run: cargo build --release --locked

      - name: Rewrite PKGBUILD for this version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          # The tag has to exist before anything is published, and it is what the
          # PKGBUILD's VCS source points at. There is deliberately no checksum
          # here: GitHub's archive tarballs are generated per request and are not
          # byte-reproducible, so pinning a hash on one produces a package that
          # builds locally and fails on AUR. git verifies the tag instead.
          if ! git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} does not exist on the remote"
            exit 1
          fi

          # pkgrel resets on a new pkgver and increments when the same version is
          # republished, which is the PKGBUILD-only-fix case. Read from the AUR
          # RPC so a rerun does not silently reuse a pkgrel that is already taken.
          #
          # AUR's RPC intermittently answers 502 and drops TLS, and this is the
          # only reason the step talks to AUR at all. One unlucky read should not
          # fail a publish, so it is retried; if it never answers, the step says
          # so rather than guessing a pkgrel and letting AUR reject the push
          # with a less useful message.
          published=""
          for attempt in 1 2 3 4 5; do
            published=$(curl -fsSL --max-time 20 "https://aur.archlinux.org/rpc/v5/info?arg[]=inno" \
              | sed -n 's/.*"Version":"\([^"]*\)".*/\1/p') && [ -n "$published" ] && break
            echo "AUR RPC attempt $attempt did not answer, retrying"
            sleep $((attempt * 5))
          done
          if [ -z "$published" ]; then
            echo "::error::could not read the current version from the AUR RPC after 5 attempts, so pkgrel cannot be chosen safely"
            exit 1
          fi
          pv=${published%%-*}
          rel=${published##*-}
          if [ "$pv" = "$VERSION" ]; then
            pkgrel=$(( ${rel:-0} + 1 ))
          else
            pkgrel=1
          fi

          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=${pkgrel}/" \
            PKGBUILD

          echo "AUR currently has: ${published:-nothing}"
          echo "publishing:        ${VERSION}-${pkgrel}"
          # Informational only, so it must not be the last command deciding
          # whether the step passed.
          git --no-pager diff -- PKGBUILD || true

      # makepkg is the only correct generator for .SRCINFO; hand-rolling it is
      # how a package ends up with a stale field nobody notices.
      #
      # makepkg refuses to run as root and exits 10, and a container's default
      # user is root, so it runs as the runner's uid with a writable HOME.
      - name: Generate .SRCINFO
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/pkg" -w /pkg archlinux:base-devel makepkg --printsrcinfo > .SRCINFO

      - name: Push to AUR
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          # The commit message quotes the version, and set -u turns a missing
          # env var into a hard failure partway through the push.
          VERSION: ${{ steps.version.outputs.value }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_SSH_PASSPHRASE: ${{ secrets.AUR_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # `%s\n` rather than `%s`, because a key without its final newline is
          # rejected as an invalid format. The sed collapses a key that was
          # pasted as one line with literal \n, which is how a secret usually
          # arrives mangled.
          printf '%s\n' "$AUR_SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          # A passphrase-protected key needs an askpass helper. This OpenSSH does
          # not read the passphrase from stdin, it goes straight to SSH_ASKPASS
          # and fails when there is none, so piping it in is not enough. The
          # helper reads it from the environment, so it holds no secret and the
          # passphrase never reaches a command line.
          #
          # timeout is not decoration: a wrong passphrase retries the askpass
          # helper forever otherwise, and the step would burn the whole job
          # timeout instead of failing.
          ask=$(mktemp)
          trap 'rm -f "$ask"; ssh-agent -k >/dev/null' EXIT
          printf '#!/bin/sh\nprintf "%%s\\n" "$AUR_SSH_PASSPHRASE"\n' > "$ask"
          chmod 700 "$ask"
          export SSH_ASKPASS="$ask" SSH_ASKPASS_REQUIRE=force DISPLAY=:0

          # The agent is started here rather than in an earlier step because its
          # socket does not survive between steps, and the push below needs it.
          eval "$(ssh-agent -s)"
          # A wrong passphrase makes ssh-add retry the askpass helper silently
          # until it is killed, so without a timeout this burns the whole job
          # timeout and says nothing. With one it fails in 30 seconds and says
          # what to check.
          if ! timeout 30 ssh-add ~/.ssh/aur; then
            echo "::error::could not unlock the AUR key. Either AUR_SSH_PASSPHRASE does not match AUR_SSH_KEY, or AUR_SSH_KEY is not the key registered on the AUR account."
            exit 1
          fi
          ssh-add -l

          # Only ever push with the key that is registered on the AUR account.
          # This also catches AUR_SSH_KEY having been set to some other key,
          # which would otherwise show up only as an AUR permission error.
          expected="SHA256:OSlaDFCaio3RmFkvQ3YGyWYGzhrdgzpUlCpJHhFjoUQ"
          got=$(ssh-add -l | awk 'NR==1 {print $2}')
          if [ "$got" != "$expected" ]; then
            echo "::error::AUR_SSH_KEY is $got, expected $expected"
            exit 1
          fi
          echo "authenticated as $got"

          # BatchMode matters more than it looks: without it, ssh will sit
          # waiting for a passphrase or a host-key confirmation on a runner that
          # has neither, and the step hangs instead of failing. ConnectTimeout
          # covers AUR being unreachable, which is what an actual outage looks
          # like from here.
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new"

          # Proves the key authenticates to AUR before anything is committed.
          if ! timeout 60 git ls-remote aur@aur.archlinux.org:inno.git > /dev/null; then
            echo "::error::could not read the AUR package repo over SSH. The key is loaded and correct, so this is AUR being unreachable or refusing the connection."
            exit 1
          fi

          work=$(mktemp -d)
          timeout 120 git clone --quiet aur@aur.archlinux.org:inno.git "$work/aur"
          cp PKGBUILD .SRCINFO "$work/aur/"
          cd "$work/aur"
          git add PKGBUILD .SRCINFO
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "inno ${VERSION} from ${GITHUB_SHA}"
          timeout 120 git push