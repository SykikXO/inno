# Inno Battery Notification Configuration

# Frame animations. Frames are decoded lazily and at display size, so a long
# sequence costs almost nothing until it plays.
#   source      directory of PNG frames, relative to this file
#   fps         playback rate; the frame clock follows this, not general.fps
#   loop        restart at the end instead of finishing
#   display     "anim" shows the animation alone, "text" puts it above the text
#   on_complete what a non-looping animation does at its last frame:
#               "hold" (default) leaves the frame up, "hide" dismisses,
#               "loop" restarts regardless of loop
[animations]
cube_charge = { source = "assets/animations/cube_charging", fps = 30, loop = true, display = "text" }
ripple = { source = "assets/animations/ripple_charge", fps = 12, loop = true, display = "text" }
# A one-shot animation: plays through and then hides, rather than holding its
# last frame. Change display to "anim" to show the animation with no text.
once = { source = "assets/animations/ripple_charge", fps = 30, loop = false, display = "text", on_complete = "hide" }

[general]
font = "InputMono Nerd Font"
font_size = 18.0
font_slant = "normal"    # normal, italic, oblique
font_weight = "normal"   # normal, bold
position = "center,center,0,0,0,0"
format = "{message} {percent}%"
fps = 60
# sound = false        # same as --no-sound

[appearance]
text_color = [1.0, 1.0, 1.0, 1.0]
bg_color = [0.0, 0.0, 0.0, 0.5]
border_radius = 8.0
gradient = true

# Optional settings
# output = "primary"       # primary, all, or output name
# battery_mode = "first"   # first, combined, highest, lowest

# Named colors (referenced by signals)
[colors]
white = [1.0, 1.0, 1.0, 1.0]
red = [1.0, 0.0, 0.0, 1.0]
orange = [1.0, 0.65, 0.0, 1.0]
yellow = [1.0, 1.0, 0.0, 1.0]
green = [0.0, 1.0, 0.0, 1.0]
violet = [0.6, 0.4, 0.8, 1.0]

# Signals triggered based on battery state
# Sound files are bundled in assets/sounds/ and should be copied to
# ~/.config/inno/sounds/ for local use.
[[signal]]
message = "Discharging"
icon = ""
icon_size = 24
color = "white"
threshold = 100
state = "discharging"
animation = "fade"
animation_ref = "ripple"
duration = 8
sound = "assets/sounds/hardware_remove.wav"

[[signal]]
message = "Charging"
icon = "󱐋"
icon_size = 28
color = "green"
threshold = 0
state = "charging"
# animation is the transition, animation_ref is the content, and they compose.
# duration is omitted here, so the notification lasts exactly as long as the
# cube does.
animation = "fade"
animation_ref = "cube_charge"
duration = 8
sound = "assets/sounds/hardware_insert.wav"

[[signal]]
message = "Critical!"
icon = "󱃍"
icon_size = 28
color = "red"
threshold = 15
state = "discharging"
animation = "blink"
duration = 0
sound = "assets/sounds/battery_critical.wav"

[[signal]]
message = "Low Battery!"
icon = "󰂃"
icon_size = 28
color = "orange"
threshold = 25
state = "discharging"
animation = "pulse"
duration = 30
sound = "assets/sounds/battery_low.wav"

[[signal]]
message = "Optimal!"
icon = "󱊦"
icon_size = 28
color = "yellow"
threshold = 80
state = "charging"
# Non-looping: plays through, then hides when the last frame lands. No
# duration, so it lasts exactly as long as the animation does.
animation = "pulse"
animation_ref = "once"
sound = "assets/sounds/notify.wav"

[[signal]]
message = "{message}"
icon = "󰂱"
icon_size = 28
color = "green"
threshold = 100
state = "connected"
animation = "fade"
duration = 3
sound = "assets/sounds/notify.wav"

[[signal]]
message = "{message}"
icon = "󰂲"
icon_size = 28
color = "white"
threshold = 100
state = "disconnected"
animation = "fade"
duration = 3
sound = "assets/sounds/disconnect.wav"
